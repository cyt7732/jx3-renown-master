<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剑网3名望时间管理大师 | JX3 Celebrity Timetable</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== CSS Variables ========== */
        :root {
            --bg-deep: #09090f;
            --bg-surface: #111118;
            --bg-elevated: #181825;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.09);
            --border: rgba(255, 255, 255, 0.06);
            --border-active: rgba(240, 192, 96, 0.3);
            --text: #e4e4ef;
            --text-dim: #828298;
            --text-muted: #5a5a72;
            --gold: #f0c060;
            --gold-dim: rgba(240, 192, 96, 0.15);
            --chutian: #5ec970;
            --yuncong: #5ea3f0;
            --pifeng: #b87fe0;
            --qiongye: #f0a050;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --transition: 0.2s ease;
            --font: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Courier New', monospace;
        }

        /* ========== Reset & Base ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse 50% 40% at 15% 25%, rgba(240, 192, 96, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 75% 60%, rgba(94, 163, 240, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 35% at 50% 85%, rgba(184, 127, 224, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

        /* ========== Header ========== */
        header {
            text-align: center;
            margin-bottom: 28px;
            padding: 32px 24px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
        }
        header h1 {
            color: var(--gold);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        header h1 i { font-size: 1.6rem; opacity: 0.85; }
        header .subtitle {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        /* ========== Dashboard Layout ========== */
        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 1024px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        /* ========== Sidebar ========== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 24px;
        }
        .sidebar-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(24px);
            transition: border-color var(--transition);
        }
        .sidebar-card:hover { border-color: rgba(255,255,255,0.1); }
        .card-title {
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title i { font-size: 0.85rem; opacity: 0.7; }

        /* Filter */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .filter-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: var(--radius-xs);
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.88rem;
            user-select: none;
        }
        .filter-chip:hover { background: rgba(255,255,255,0.06); }
        .filter-chip.active { background: var(--gold-dim); border-color: var(--border-active); }
        .filter-chip input { display: none; }
        .org-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .org-dot.chutian { background: var(--chutian); box-shadow: 0 0 6px rgba(94,201,112,0.5); }
        .org-dot.yuncong { background: var(--yuncong); box-shadow: 0 0 6px rgba(94,163,240,0.5); }
        .org-dot.pifeng { background: var(--pifeng); box-shadow: 0 0 6px rgba(184,127,224,0.5); }
        .org-dot.qiongye { background: var(--qiongye); box-shadow: 0 0 6px rgba(240,160,80,0.5); }

        /* Time Range */
        .range-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .range-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(240,192,96,0.4);
            transition: transform var(--transition);
        }
        .range-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
        .range-label {
            font-weight: 600;
            color: var(--gold);
            min-width: 55px;
            text-align: right;
            font-size: 0.9rem;
        }

        /* Custom Time */
        .custom-time-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-radius: var(--radius-xs);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 0.88rem;
            user-select: none;
        }
        .custom-time-toggle:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.1); }
        .custom-time-toggle .chevron { transition: transform var(--transition); }
        .custom-time-toggle .chevron.open { transform: rotate(180deg); }
        .custom-time-body {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
        }
        .custom-time-body.open { max-height: 120px; }
        .custom-time-body .inner { padding: 14px 20px 16px; display: flex; gap: 8px; }
        .custom-time-body input[type="time"] {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            padding: 8px 12px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-xs);
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn-primary { background: var(--gold); color: #1a1a2e; }
        .btn-primary:hover { background: #f5cc70; }
        .btn-reset { background: rgba(244,67,54,0.2); color: #f87171; }
        .btn-reset:hover { background: rgba(244,67,54,0.35); }

        /* Status Bar */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .status-row .label { color: var(--text-dim); }
        .status-row .value { color: var(--text-dim); }
        .status-row .value.highlight { color: var(--gold); }

        /* Cycle Info */
        .cycle-info {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.7;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
        }
        .cycle-info strong { color: var(--text-dim); }

        /* ========== Main Content ========== */
        .main-content {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            backdrop-filter: blur(24px);
        }
        .table-header-bar {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header-bar h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .table-header-bar .badge {
            font-size: 0.78rem;
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .table-wrap { overflow: visible; }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }
        thead { position: sticky; top: 0; z-index: 10; }
        th {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: rgba(24,24,37,0.95);
            border-bottom: 2px solid var(--border-active);
            white-space: nowrap;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.9rem;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: none; }
        tr { transition: background var(--transition); }
        tbody tr:hover { background: rgba(255,255,255,0.03); }

        /* Row states */
        tr.row-current {
            background: linear-gradient(90deg, rgba(240,192,96,0.12) 0%, rgba(240,192,96,0.03) 60%, transparent 100%);
            border-left: 3px solid var(--gold);
        }
        tr.row-current td:first-child { padding-left: 13px; }

        /* Badges */
        .org-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .org-badge.chutian { background: rgba(94,201,112,0.15); color: var(--chutian); }
        .org-badge.yuncong { background: rgba(94,163,240,0.15); color: var(--yuncong); }
        .org-badge.pifeng { background: rgba(184,127,224,0.15); color: var(--pifeng); }
        .org-badge.qiongye { background: rgba(240,160,80,0.15); color: var(--qiongye); }

        .time-cell { font-weight: 700; color: var(--gold); font-family: var(--font-mono); font-size: 0.95rem; }
        .map-cell { color: #81c784; }
        .site-cell { color: #90caf9; }
        .stage-cell { display: flex; align-items: center; gap: 8px; }
        .stage-icon {
            width: 26px; height: 26px;
            border-radius: 4px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .desc-cell { color: var(--text-dim); font-size: 0.84rem; max-width: 300px; }

        /* Status pills */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .status-pill.current { background: rgba(240,192,96,0.2); color: var(--gold); }
        .status-pill.upcoming { background: rgba(255,255,255,0.05); color: var(--text-dim); }

        /* States */
        .loading-state, .empty-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .loading-state i, .empty-state i, .error-state i { font-size: 1.8rem; margin-bottom: 12px; display: block; }
        .loading-state i { color: var(--gold); }
        .error-state { color: #f87171; }
        .error-state i { color: #f87171; }

        /* Footer */
        .footer { text-align: center; padding: 24px 0 8px; }
        .footer .ver { color: var(--text-muted); font-size: 0.75rem; }
        .footer .copy { color: var(--text-muted); font-size: 0.7rem; margin-top: 4px; opacity: 0.6; }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            header { padding: 20px 16px; }
            header h1 { font-size: 1.5rem; }
            th, td { padding: 10px 8px; font-size: 0.82rem; }
            .desc-cell { max-width: 160px; font-size: 0.78rem; }
            .filter-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            th:nth-child(4), td:nth-child(4),
            th:nth-child(5), td:nth-child(5) { display: none; }
            table { display: block; overflow-x: auto; }
        }

        /* ========== Animations ========== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.35s ease both; }
        tbody tr:nth-child(1) { animation-delay: 0.02s; }
        tbody tr:nth-child(2) { animation-delay: 0.04s; }
        tbody tr:nth-child(3) { animation-delay: 0.06s; }
        tbody tr:nth-child(4) { animation-delay: 0.08s; }
        tbody tr:nth-child(5) { animation-delay: 0.10s; }
        tbody tr:nth-child(6) { animation-delay: 0.12s; }
        tbody tr:nth-child(7) { animation-delay: 0.14s; }
        tbody tr:nth-child(8) { animation-delay: 0.16s; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><img src="https://jx3.xoyo.com/p/zt/2023/10/26/index/favicon-200x200.png" alt="" style="width:32px;height:32px;vertical-align:middle;">剑网3名望时间管理大师</h1>
            <p class="subtitle">实时追踪楚天社 · 云从社 · 披风会 · 穹野卫名望活动进度</p>
        </header>

        <div class="dashboard">
            <!-- ====== Sidebar ====== -->
            <aside class="sidebar">

                <!-- 组织筛选 -->
                <div class="sidebar-card">
                    <div class="card-title"><i class="fas fa-filter"></i>名望组织</div>
                    <div class="filter-grid" id="filter-grid"></div>
                </div>

                <!-- 时间范围 -->
                <div class="sidebar-card">
                    <div class="card-title"><i class="fas fa-clock"></i>时间范围</div>
                    <div class="range-row">
                        <input type="range" min="30" max="1440" step="30" value="60" class="range-slider" id="range-slider">
                        <span class="range-label" id="range-label">1小时</span>
                    </div>
                </div>

                <!-- 自定义时间 -->
                <div class="sidebar-card" style="padding:0; overflow:hidden;">
                    <div class="custom-time-toggle" id="custom-time-toggle">
                        <span><i class="fas fa-user-clock"></i>&nbsp; 自定义时间</span>
                        <i class="fas fa-chevron-down chevron" id="custom-chevron"></i>
                    </div>
                    <div class="custom-time-body" id="custom-time-body">
                        <div class="inner">
                            <input type="time" id="custom-time-input">
                            <button class="btn btn-primary" id="custom-time-apply">应用</button>
                            <button class="btn btn-reset" id="custom-time-reset">重置</button>
                        </div>
                    </div>
                </div>

                <!-- 状态 -->
                <div class="sidebar-card">
                    <div class="card-title"><i class="fas fa-info-circle"></i>状态</div>
                    <div class="status-row"><span class="label">当前时间</span><span class="value highlight" id="current-time">--</span></div>
                    <div class="status-row"><span class="label">最后更新</span><span class="value" id="last-updated">--</span></div>
                    <div class="status-row"><span class="label">显示活动</span><span class="value" id="total-activities">0</span></div>
                    <div class="status-row"><span class="label">下次刷新</span><span class="value" id="next-refresh">--</span></div>
                </div>

                <!-- 循环规则 -->
                <div class="cycle-info">
                    <strong>循环规则</strong><br>
                    楚天社：2小时（烂柯山→晟江→百溪→楚州）<br>
                    云从社：2小时循环<br>
                    披风会：3小时循环<br>
                    穹野卫：3小时循环
                </div>

            </aside>

            <!-- ====== Main Table ====== -->
            <main class="main-content">
                <div class="table-header-bar">
                    <h2>名望时间表</h2>
                    <span class="badge" id="table-badge">加载中...</span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>组织</th>
                                <th>时间</th>
                                <th>地图</th>
                                <th>地点</th>
                                <th>活动阶段</th>
                                <th>任务描述</th>
                            </tr>
                        </thead>
                        <tbody id="activities-table">
                            <tr><td colspan="6" class="loading-state"><i class="fas fa-spinner fa-spin"></i>正在加载活动数据...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>

        <div class="footer">
            <div class="ver">JX3 Celebrity Timetable v1.1.3 | 2026-07-03</div>
            <div class="copy">&copy; 2026 凌千羽·龙争虎斗. All Rights Reserved.</div>
        </div>
    </div>

    <script>
    /* ================================================================
       剑网3名望时间管理大师 v1.1.3
       重构：统一相对偏移时间模型，消除跨日特判逻辑
       ================================================================ */

    // ── 配置 ──────────────────────────────────────────────
    const ORG_CONFIG = {
        '楚天社': { id: '楚天社', type: 0, cycle: 120, color: 'chutian', name: '楚天社' },
        '云从社': { id: '云从社', type: 1, cycle: 120, color: 'yuncong', name: '云从社' },
        '披风会': { id: '披风会', type: 2, cycle: 180, color: 'pifeng', name: '披风会' },
        '穹野卫': { id: '穹野卫', type: 3, cycle: 180, color: 'qiongye', name: '穹野卫' }
    };
    const ORG_IDS = Object.keys(ORG_CONFIG);

    const CACHE_TTL = 30 * 60 * 1000;
    const CACHE_VER = 'v1.1';
    const ICON_BASE = 'https://img.jx3box.com/pve/minimap/minimap_';
    const API_BASE = 'https://cms.jx3box.com/api/cms/game/celebrity?type=';

    // ── DOM refs ──────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const dom = {
        filterGrid: $('filter-grid'),
        rangeSlider: $('range-slider'),
        rangeLabel: $('range-label'),
        customToggle: $('custom-time-toggle'),
        customChevron: $('custom-chevron'),
        customBody: $('custom-time-body'),
        customInput: $('custom-time-input'),
        customApply: $('custom-time-apply'),
        customReset: $('custom-time-reset'),
        currentTime: $('current-time'),
        lastUpdated: $('last-updated'),
        totalActivities: $('total-activities'),
        nextRefresh: $('next-refresh'),
        tableBody: $('activities-table'),
        tableBadge: $('table-badge'),
    };

    // ── 状态 ──────────────────────────────────────────────
    const state = {
        // 数据：按组织分组，每个活动已预处理 cycleOffset
        activitiesByOrg: {},
        // 用户偏好
        selectedOrgs: [...ORG_IDS],
        timeRange: 60,         // 分钟
        customTime: null,      // "HH:MM" | null
        // 运行时
        dataLoaded: false,
        nextRefresh: null,
        refreshTimer: null,
        customExpanded: false,
    };

    // ── 工具函数 ──────────────────────────────────────────
    const pad = n => String(n).padStart(2, '0');
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const mod = (v, base) => ((v % base) + base) % base;

    function safeStorageGet(key) {
        try {
            return localStorage.getItem(key);
        } catch (e) {
            console.warn('localStorage读取失败:', e.message);
            return null;
        }
    }

    function safeStorageSet(key, value) {
        try {
            localStorage.setItem(key, value);
            return true;
        } catch (e) {
            console.warn('localStorage写入失败:', e.message);
            return false;
        }
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[ch]));
    }

    function activityKey(a) {
        return a.id != null
            ? `id:${a.id}`
            : `raw:${a.key || ''}|${a.hour ?? ''}|${a.time ?? ''}|${a.stage || ''}|${a.site || ''}`;
    }

    function renderIcon(icon) {
        const safeIcon = String(icon ?? '');
        if (!/^\d+$/.test(safeIcon)) return '';
        return `<img src="${ICON_BASE}${safeIcon}.png" class="stage-icon" onerror="this.style.display='none'" alt="" loading="lazy">`;
    }

    /** 获取当前模拟时间 */
    function getNow() {
        const d = new Date();
        if (state.customTime) {
            const [h, m] = state.customTime.split(':').map(Number);
            d.setHours(h, m, 0, 0);
        }
        return d;
    }

    /** 当前总分钟数 (0-1439) */
    function nowMinutes() {
        const n = getNow();
        return n.getHours() * 60 + n.getMinutes();
    }

    // ── 数据加载 ──────────────────────────────────────────
    function cacheKey(orgId) { return `jx3-celeb-${CACHE_VER}-${orgId}`; }

    function getCached(orgId) {
        const raw = safeStorageGet(cacheKey(orgId));
        if (!raw) return null;
        try {
            const pkg = JSON.parse(raw);
            if (pkg && Date.now() - pkg.ts < CACHE_TTL && Array.isArray(pkg.data)) return pkg.data;
        } catch (e) { /* ignore */ }
        return null;
    }

    function setCache(orgId, data) {
        safeStorageSet(cacheKey(orgId), JSON.stringify({ ts: Date.now(), data }));
    }

    async function fetchOrg(orgId, retries = 3) {
        const cfg = ORG_CONFIG[orgId];
        const cached = getCached(orgId);
        if (cached) return cached;

        for (let i = 1; i <= retries; i++) {
            try {
                const res = await fetch(API_BASE + cfg.type);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (json.code !== 0) throw new Error(json.msg || 'API error');
                setCache(orgId, json.data);
                return json.data;
            } catch (err) {
                console.warn(`[${orgId}] 第${i}次获取失败:`, err.message);
                if (i === retries) {
                    const cached = getCached(orgId);
                    if (cached) { console.log(`[${orgId}] 使用缓存`); return cached; }
                    return [];
                }
                await new Promise(r => setTimeout(r, 1000 * i));
            }
        }
    }

    /**
     * 预处理单个活动：
     * 1. 计算 cycleOffset = hour*60 + time
     * 2. 修正楚天社/云从社奇数序列的小时偏移（API数据问题：c1/y1系列的hour标记为0，实际应为1）
     */
    function preprocessActivity(raw, orgId) {
        const cfg = ORG_CONFIG[orgId];
        let hour = raw.hour || 0;
        // API数据修正：楚天社c1*序列和云从社y1序列的hour应+1
        if (orgId === '楚天社' && raw.key && raw.key.startsWith('c1')) hour = (hour + 1) % 24;
        if (orgId === '云从社' && raw.key === 'y1') hour = (hour + 1) % 24;
        const rawOffset = hour * 60 + (raw.time || 0);
        return {
            ...raw,
            rawOffset,
            cycleOffset: mod(rawOffset, cfg.cycle),
        };
    }

    async function loadAllData() {
        const results = await Promise.all(ORG_IDS.map(id => fetchOrg(id)));
        for (let i = 0; i < ORG_IDS.length; i++) {
            const orgId = ORG_IDS[i];
            state.activitiesByOrg[orgId] = (results[i] || []).map(a => preprocessActivity(a, orgId));
        }
        state.dataLoaded = true;
    }

    // ── 时间引擎（核心重构）────────────────────────────────
    /**
     * 相对偏移模型：
     * - 每个活动有 cycleOffset（在周期内的分钟偏移，0 ~ cycleLength-1）
     * - 当前时间在周期内的位置：currentOffset = nowMinutes % cycleLength
     * - 活动距现在的分钟数：(cycleOffset - currentOffset + cycleLength) % cycleLength
     * - 跨日问题自然消失——因为所有比较都是相对偏移，不依赖绝对时间轴
     */
    function minutesUntil(cycleOffset, currentOffset, cycleLength) {
        return (cycleOffset - currentOffset + cycleLength) % cycleLength;
    }

    /** 找出当前活动：在 cycleOffset <= currentOffset 的活动中取偏移最大的 */
    function findCurrentActivity(activities, currentOffset) {
        if (!activities.length) return null;
        const candidates = activities.filter(a => a.cycleOffset <= currentOffset);
        if (candidates.length === 0) {
            // 所有活动都在未来 → 当前活动是上一周期的最后一个
            const max = activities.reduce((a, b) => a.cycleOffset > b.cycleOffset ? a : b);
            return max;
        }
        return candidates.reduce((a, b) => a.cycleOffset > b.cycleOffset ? a : b);
    }

    /** 格式化显示时间：当前活动显示最近一次发生时间，未来活动显示下一次发生时间 */
    function formatDisplayTime(cycleOffset, currentMinutes, cycleLength, isCurrent) {
        const currentOffset = currentMinutes % cycleLength;
        let dist;
        if (isCurrent) {
            // 当前活动：计算距最近一次发生时间的偏移（负数或0）
            dist = cycleOffset - currentOffset;
            if (dist > 0) dist -= cycleLength;  // 发生在上一周期
        } else {
            // 未来活动：距下一次发生的偏移（正数）
            dist = minutesUntil(cycleOffset, currentOffset, cycleLength);
        }
        let absolute = currentMinutes + dist;
        absolute = ((absolute % 1440) + 1440) % 1440;
        return `${pad(Math.floor(absolute / 60))}:${pad(absolute % 60)}`;
    }

    /** 获取单个组织的活动展示列表 */
    function getOrgDisplay(orgId) {
        const activities = state.activitiesByOrg[orgId] || [];
        if (!activities.length) return [];

        const cfg = ORG_CONFIG[orgId];
        const currentMinutes = nowMinutes();
        const currentOffset = currentMinutes % cfg.cycle;

        // 找当前活动
        const current = findCurrentActivity(activities, currentOffset);

        const results = [];
        const seen = new Set();

        if (current) {
            const key = `${orgId}|${activityKey(current)}`;
            if (!seen.has(key)) {
                seen.add(key);
                results.push({
                    ...current,
                    orgId,
                    orgColor: cfg.color,
                    isCurrent: true,
                    displayTime: formatDisplayTime(current.cycleOffset, currentMinutes, cfg.cycle, true),
                    sortKey: (() => {  // 用绝对开始分钟数排序，跨周期cycleOffset不可比
                        let d = current.cycleOffset - currentOffset;
                        if (d > 0) d -= cfg.cycle;
                        return (currentMinutes + d) - 100000;
                    })(),  // 当前活动始终排最前，内部按绝对开始时间排序
                });
            }
        }

        // 未来活动：距现在 <= timeRange 分钟
        for (const a of activities) {
            const key = `${orgId}|${activityKey(a)}`;
            if (seen.has(key)) continue;
            const dist = minutesUntil(a.cycleOffset, currentOffset, cfg.cycle);
            if (dist > 0 && dist <= state.timeRange) {
                seen.add(key);
                results.push({
                    ...a,
                    orgId,
                    orgColor: cfg.color,
                    isCurrent: false,
                    displayTime: formatDisplayTime(a.cycleOffset, currentMinutes, cfg.cycle, false),
                    sortKey: dist,
                });
            }
        }

        return results;
    }

    /** 获取所有选中组织的活动，统一排序 */
    function getAllDisplayActivities() {
        const all = [];
        for (const orgId of state.selectedOrgs) {
            all.push(...getOrgDisplay(orgId));
        }
        all.sort((a, b) => a.sortKey - b.sortKey);
        return all;
    }

    // ── 渲染 ──────────────────────────────────────────────
    function renderFilterChips() {
        dom.filterGrid.innerHTML = ORG_IDS.map(orgId => {
            const cfg = ORG_CONFIG[orgId];
            const active = state.selectedOrgs.includes(orgId);
            return `
                <label class="filter-chip ${active ? 'active' : ''}" data-org="${orgId}">
                    <span class="org-dot ${cfg.color}"></span>
                    ${cfg.name}
                </label>`;
        }).join('');

        dom.filterGrid.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const orgId = chip.dataset.org;
                if (state.selectedOrgs.includes(orgId)) {
                    state.selectedOrgs = state.selectedOrgs.filter(o => o !== orgId);
                } else {
                    state.selectedOrgs.push(orgId);
                }
                savePrefs();
                renderAll();
            });
        });
    }

    function formatRangeLabel(minutes) {
        if (minutes < 60) return `${minutes}分钟`;
        const h = minutes / 60;
        if (h === Math.floor(h)) return `${h}小时`;
        return `${h}小时`;  // 1.5, 2.5, ...
    }

    function renderTable() {
        if (!state.dataLoaded) return;

        const activities = getAllDisplayActivities();

        dom.totalActivities.textContent = activities.length;
        dom.tableBadge.textContent = activities.length ? `共 ${activities.length} 项` : '无结果';

        if (!activities.length) {
            dom.tableBody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="fas fa-search"></i>没有匹配的活动数据</td></tr>`;
            return;
        }

        dom.tableBody.innerHTML = activities.map(a => {
            const rowClass = a.isCurrent ? 'row-current' : '';
            const statusIcon = a.isCurrent ? 'fa-play-circle' : 'fa-circle';
            const icon = renderIcon(a.icon);
            return `
                <tr class="fade-in ${rowClass}">
                    <td>
                        <span class="org-badge ${a.orgColor}">
                            <i class="fas ${statusIcon}"></i> ${escapeHtml(a.orgId)}
                        </span>
                    </td>
                    <td class="time-cell">${escapeHtml(a.displayTime)}</td>
                    <td class="map-cell">${escapeHtml(a.map)}</td>
                    <td class="site-cell">${escapeHtml(a.site)}</td>
                    <td><span class="stage-cell">${icon}${escapeHtml(a.stage)}</span></td>
                    <td class="desc-cell">${escapeHtml(a.desc)}</td>
                </tr>`;
        }).join('');

        dom.lastUpdated.textContent = new Date().toLocaleTimeString('zh-CN');
    }

    function updateTimeDisplay() {
        const n = getNow();
        const ts = n.toLocaleTimeString('zh-CN');
        if (state.customTime) {
            dom.currentTime.innerHTML = `${ts} <i class="fas fa-user-clock" style="color:#5ea3f0;font-size:0.7rem;"></i>`;
        } else {
            dom.currentTime.textContent = ts;
        }
        // 下次刷新倒计时
        if (state.customTime) {
            dom.nextRefresh.textContent = '自定义模式';
        } else if (state.nextRefresh) {
            const sec = Math.max(0, Math.floor((state.nextRefresh - Date.now()) / 1000));
            dom.nextRefresh.textContent = `${sec}秒`;
        }
    }

    function renderAll() {
        renderFilterChips();
        renderTable();
        updateTimeDisplay();
    }

    // ── 偏好存取 ──────────────────────────────────────────
    function savePrefs() {
        safeStorageSet('jx3-prefs', JSON.stringify({
            selectedOrgs: state.selectedOrgs,
            timeRange: state.timeRange,
        }));
    }

    function loadPrefs() {
        const raw = safeStorageGet('jx3-prefs');
        if (raw) {
            try {
                const p = JSON.parse(raw);
                if (Array.isArray(p.selectedOrgs)) {
                    const selected = p.selectedOrgs.filter(orgId => ORG_IDS.includes(orgId));
                    state.selectedOrgs = selected.length ? selected : [...ORG_IDS];
                }
                if (Number.isFinite(Number(p.timeRange))) {
                    state.timeRange = clamp(Number(p.timeRange), 30, 1440);
                }
            } catch (e) { /* ignore */ }
        }
        dom.rangeSlider.value = state.timeRange;
        dom.rangeLabel.textContent = formatRangeLabel(state.timeRange);
    }

    // ── 定时刷新 ──────────────────────────────────────────
    function scheduleRefresh() {
        if (state.refreshTimer) clearTimeout(state.refreshTimer);
        const now = Date.now();
        const next = new Date(now);
        next.setMinutes(next.getMinutes() + 1, 0, 0);
        state.nextRefresh = next.getTime();
        state.refreshTimer = setTimeout(() => {
            if (!state.customTime) renderAll();
            scheduleRefresh();
        }, next - now);
    }

    // ── 事件绑定 ──────────────────────────────────────────
    function bindEvents() {
        dom.rangeSlider.addEventListener('input', () => {
            state.timeRange = parseInt(dom.rangeSlider.value);
            dom.rangeLabel.textContent = formatRangeLabel(state.timeRange);
            savePrefs();
            renderAll();
        });

        dom.customToggle.addEventListener('click', () => {
            state.customExpanded = !state.customExpanded;
            if (state.customExpanded) {
                dom.customChevron.classList.add('open');
                dom.customBody.classList.add('open');
            } else {
                dom.customChevron.classList.remove('open');
                dom.customBody.classList.remove('open');
            }
        });

        dom.customApply.addEventListener('click', () => {
            const v = dom.customInput.value;
            if (v) {
                state.customTime = v;
                renderAll();
            }
        });

        dom.customReset.addEventListener('click', () => {
            state.customTime = null;
            dom.customInput.value = '';
            renderAll();
        });
    }

    // ── 启动 ──────────────────────────────────────────────
    async function boot() {
        loadPrefs();
        renderFilterChips();
        bindEvents();

        // 显示加载状态
        dom.tableBody.innerHTML = `<tr><td colspan="6" class="loading-state"><i class="fas fa-spinner fa-spin"></i>正在加载活动数据...</td></tr>`;

        try {
            await loadAllData();
        } catch (err) {
            console.error('数据加载失败:', err);
            dom.tableBody.innerHTML = `<tr><td colspan="6" class="error-state"><i class="fas fa-exclamation-triangle"></i>数据加载失败，请检查网络或刷新页面</td></tr>`;
            return;
        }

        renderAll();
        scheduleRefresh();

        // 每秒更新时间显示
        setInterval(updateTimeDisplay, 1000);
    }

    boot();
    </script>
</body>
</html>
